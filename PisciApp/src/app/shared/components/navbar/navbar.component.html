<nav class="navbar">
  <div class="nav-left">
    <img src="/assets/logob.png" alt="PisciApp" class="logo" />
  </div>

  <button class="menu-toggle" (click)="toggleMenu()">
    &#9776;
  </button>

  <ul class="nav-links" [class.active]="menuAbierto">
    <li><a routerLink="/inicio" routerLinkActive="active">Inicio</a></li>
    <li>
      <a routerLink="/diario" routerLinkActive="active">Reporte diario</a>
    </li>
    <li><a routerLink="/ciclos" routerLinkActive="active">Ciclos</a></li>
    <li>
      <a href="/configuracion" routerLinkActive="active">Configuración</a>
    </li>
    <li>
      <a href="/inventario" routerLinkActive="active">Inventario</a>
    </li>
  </ul>

  <div class="nav-right" *ngIf="user">
    <div class="user-info">
      <div class="user-icon">
        {{ userInitials }}
      </div>
      <span class="username">{{ user.nombre }}</span>
    </div>
    <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
  </div>
</nav>
